[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/auth_yahoo.py" = ["E402"]
"src/cloud_sync.py" = ["E402"]
"src/live_draft_assistant.py" = ["E402"]
"src/yahoo_browser_sync.py" = ["E402"]
