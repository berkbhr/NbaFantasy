name: NBA Fantasy Autonomous Cloud Sync & Notification Engine

on:
  push:
    branches: [ main ]
    paths:
      - 'data/processed/league_state.json'
      - 'data/processed/live_matchup.json'
  schedule:
    # UTC schedules; local Germany/Eastern times change with DST.
    - cron: '30 6 * * *'
    - cron: '30 12 * * *'
    - cron: '30 18 * * *'
    - cron: '15 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the live pipeline without sending Telegram/Discord'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nba-fantasy-autonomous-sync
  cancel-in-progress: false

jobs:
  autonomous-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore runtime history and season cache
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin nba-fantasy-bot >/dev/null 2>&1; then
            git fetch origin nba-fantasy-bot
            for path in data/raw/player_logs_2026_27.parquet data/processed/injuries.db; do
              if git cat-file -e "origin/nba-fantasy-bot:$path" 2>/dev/null; then
                mkdir -p "$(dirname "$path")"
                git show "origin/nba-fantasy-bot:$path" > "$path"
              fi
            done
            if git cat-file -e origin/nba-fantasy-bot:data/archive 2>/dev/null; then
              git archive origin/nba-fantasy-bot data/archive | tar -x
            fi
          fi

      - name: Run NBA Fantasy Autonomous Cloud Sync & Notifications
        env:
          YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_KEY: ${{ secrets.YAHOO_LEAGUE_KEY }}
          YAHOO_TEAM_KEY: ${{ secrets.YAHOO_TEAM_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NBA_FANTASY_DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          python -u -m src.cloud_sync

      - name: Upload Latest Executive Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-fantasy-cloud-report
          path: |
            reports/latest_cloud_summary.md
            data/processed/league_state.json
            reports/telegram_preview.html
            reports/prospective_status.json
            reports/latest_forecast.json
            reports/delivery_receipt.json
          retention-days: 14

      - name: Persist runtime history on nba-fantasy-bot
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          runtime_dir="$RUNNER_TEMP/nba-runtime"
          if git show-ref --verify --quiet refs/remotes/origin/nba-fantasy-bot; then
            git worktree add --detach "$runtime_dir" origin/nba-fantasy-bot
          else
            git worktree add --detach "$runtime_dir" HEAD
          fi
          for path in data/archive data/processed/injuries.db data/processed/league_state.json data/processed/live_matchup.json data/raw/player_logs_2026_27.parquet reports/latest_cloud_summary.md reports/latest_forecast.json reports/prospective_status.json reports/telegram_preview.html reports/delivery_receipt.json; do
            if [ -e "$path" ]; then
              mkdir -p "$runtime_dir/$(dirname "$path")"
              if [ -d "$path" ]; then
                mkdir -p "$runtime_dir/$path"
                cp -a "$path/." "$runtime_dir/$path/"
              else
                cp -f "$path" "$runtime_dir/$path"
              fi
              git -C "$runtime_dir" add -f "$path"
            fi
          done
          if ! git -C "$runtime_dir" diff --staged --quiet; then
            git -C "$runtime_dir" commit -m "Archive prospective forecasts, outcomes and injury history [skip ci]"
            git -C "$runtime_dir" push origin HEAD:nba-fantasy-bot
          fi
