name: NBA Fantasy Autonomous Cloud Sync & Notification Engine

on:
  schedule:
    # 3 Strategic Daily Run Times (TR / UTC / ET synchronized):
    - cron: '30 7 * * *'   # 10:30 TR / 07:30 UTC / 03:30 ET (Morning scoreboard, overnight add/drops & waivers)
    - cron: '30 18 * * *'  # 21:30 TR / 18:30 UTC / 14:30 ET (NBA Afternoon Official Injury Report & depth boosts)
    - cron: '15 22 * * *'  # 01:15 TR / 22:15 UTC / 18:15 ET (Game Lock: 45 min before tip-off, IL+ & streamer alert)
  workflow_dispatch:        # Allows manual 1-click execution anytime from GitHub Actions UI

permissions:
  contents: write

concurrency:
  group: nba-fantasy-autonomous-sync
  cancel-in-progress: false

jobs:
  autonomous-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas pyarrow scipy scikit-learn requests beautifulsoup4 pulp nba_api pypdf

      - name: Run NBA Fantasy Autonomous Cloud Sync & Notifications
        env:
          YAHOO_OAUTH_JSON: ${{ secrets.YAHOO_OAUTH_JSON }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_KEY: ${{ secrets.YAHOO_LEAGUE_KEY }}
          YAHOO_TEAM_KEY: ${{ secrets.YAHOO_TEAM_KEY }}
          YAHOO_COOKIE: ${{ secrets.YAHOO_COOKIE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python src/cloud_sync.py

      - name: Upload Latest Executive Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nba-fantasy-cloud-report
          path: |
            reports/latest_cloud_summary.md
            data/processed/league_state.json
          retention-days: 14

      - name: Commit & Push Updated State to Dedicated 'nba-fantasy-bot' Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --heads origin nba-fantasy-bot | grep -q nba-fantasy-bot; then
            git checkout -B nba-fantasy-bot origin/nba-fantasy-bot
          else
            git checkout -b nba-fantasy-bot
          fi

          git add data/processed/injuries.db data/processed/league_state.json reports/latest_cloud_summary.md
          if [ -f data/processed/live_matchup.json ]; then
            git add data/processed/live_matchup.json
          fi

          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "🤖 [nba-fantasy-bot] Auto-Sync: Live Matchup, Add/Drop & Injury Boosts [skip ci]"
            git push origin nba-fantasy-bot
            echo "Changes pushed to branch nba-fantasy-bot successfully."
          else
            echo "No database or projection changes to commit."
          fi
